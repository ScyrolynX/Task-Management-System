<article
    class="task-card {% if task.completed %}completed{% endif %} {% if task.skipped %}skipped{% endif %}"
    data-priority="{{ task.priority }}"
    data-task="{{ task.content|lower }}"
>

    <div class="task-check">

        <form
            method="POST"
            action="{{ url_for('tasks.task_toggle', task_id=task.id) }}"
        >

            <button
                type="submit"
                class="check-btn"
                title="{% if task.completed %}Mark incomplete{% else %}Complete task{% endif %}"
            >
                {% if task.completed %}
                    ✓
                {% endif %}
            </button>

        </form>

    </div>


    <div class="task-main">

        <div class="task-heading">

            <h3>{{ task.content }}</h3>

            <span class="priority {{ task.priority }}">
                {{ task.priority|capitalize }}
            </span>

        </div>


        {% if task.description %}

            <p class="task-description">
                {{ task.description }}
            </p>

        {% endif %}


        <div class="task-meta">

            <span class="category">
                {{ task.category }}
            </span>


            {% if task.exp_date %}

                <span
                    class="
                        deadline
                        {% if task.is_overdue() %}
                            overdue
                        {% endif %}
                    "
                >
                    ◷
                    {{ task.exp_date.strftime('%b %d, %Y · %H:%M') }}
                </span>

            {% endif %}

        </div>

    </div>


    <div class="task-actions">

        <a
            class="task-action"
            href="{{ url_for('tasks.task_edit', task_id=task.id) }}"
            title="Edit task"
        >
            ✎
        </a>


        <form
            method="POST"
            action="{{ url_for('tasks.task_skip', task_id=task.id) }}"
        >

            <button
                class="task-action"
                type="submit"
                title="{% if task.skipped %}Restore task{% else %}Skip task{% endif %}"
            >
                {% if task.skipped %}
                    ↶
                {% else %}
                    →
                {% endif %}
            </button>

        </form>


        <form
            method="POST"
            action="{{ url_for('tasks.task_delete', task_id=task.id) }}"
            onsubmit="return confirm('Delete this task?');"
        >

            <button
                class="task-action delete"
                type="submit"
                title="Delete task"
            >
                ×
            </button>

        </form>

    </div>

</article>
